<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>IBCB Eventos — Control de Acceso</title>

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            padding: 20px;

            background: #F5F7FA;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }

        .contenedor {

            width: 100%;
            max-width: 600px;

            margin: 0 auto;

            background: #FFFFFF;

            border-radius: 16px;

            padding: 25px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);

        }

        .encabezado {

            text-align: center;

            margin-bottom: 25px;

        }

        .icono {

            font-size: 55px;

            margin-bottom: 5px;

        }

        h1 {

            margin: 5px 0;

            font-size: 26px;

        }

        .subtitulo {

            color: #666666;

            font-size: 15px;

        }

        #lectorQR {

            width: 100%;

            max-width: 500px;

            margin: 20px auto;

        }

        button {

            width: 100%;

            border: 0;

            border-radius: 10px;

            padding: 15px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            background: #1677FF;

            color: #FFFFFF;

        }

        button:disabled {

            opacity: 0.6;

            cursor: default;

        }

        #estado {

            margin-top: 20px;

            text-align: center;

            font-size: 15px;

            line-height: 1.5;

        }

    </style>

</head>


<body>

    <div class="contenedor">

        <div class="encabezado">

            <div class="icono">
                🔐
            </div>

            <h1>
                Control de Acceso
            </h1>

            <div class="subtitulo">
                IBCB Eventos
            </div>

        </div>


        <!-- ==================================
             AUTORIZACIÓN
             ================================== -->

        <div id="pantallaAutorizacion">

            <div style="
                text-align:center;
                margin-bottom:20px;
            ">

                <div style="
                    font-size:45px;
                    margin-bottom:10px;
                ">
                    🔐
                </div>

                <h2 style="
                    margin:5px 0;
                ">
                    Control de Secretaría
                </h2>

                <p style="
                    color:#666;
                    line-height:1.5;
                ">

                    Ingresá el código de Secretaría
                    para habilitar el lector.

                </p>

            </div>


            <input
                id="codigoSecretaria"
                type="password"
                placeholder="Código de Secretaría"
                autocomplete="off"
                style="
                    width:100%;
                    padding:15px;
                    border:1px solid #D5D9E0;
                    border-radius:10px;
                    font-size:16px;
                    margin-bottom:12px;
                "
            >


            <button
                id="btnAutorizar"
                onclick="autorizarDesdeGitHub()">

                🔐 Ingresar

            </button>


            <div
                id="estadoAutorizacion"
                style="
                    margin-top:15px;
                    text-align:center;
                    line-height:1.5;
                "
            ></div>

        </div>


        <!-- ==================================
             LECTOR
             ================================== -->

        <div
            id="pantallaLector"
            style="display:none;"
        >

            <div style="
    background:#EEF7EE;
    border:1px solid #B7E4C7;
    border-radius:10px;
    padding:15px;
    margin-bottom:20px;
    text-align:center;
    color:#2E7D32;
">

    <div style="
        font-size:20px;
        font-weight:bold;
        margin-bottom:6px;
    ">

        ✅ Lector autorizado

    </div>


    <div
        id="contadorIngresos"
        style="
            font-size:14px;
            color:#444;
            margin-top:8px;
        "
    >

        🎟️ Ingresos registrados:
        <b>0</b>

    </div>


    <div
        id="expiracionSesion"
        style="
            font-size:13px;
            color:#666;
            margin-top:5px;
        "
    >

        ⏱️ Sesión activa

    </div>

</div>


            <!-- LECTOR -->

            <div id="lectorQR"></div>


            <!-- ESTADO -->

            <div id="estado">

                Presioná el botón para activar
                la cámara.

            </div>


            <br>


            <button
                id="btnIniciarScanner"
                onclick="iniciarScanner()">

                📷 Activar cámara

            </button>

        </div>

    </div>


<script>

    let scannerQR = null;

let scannerActivo = false;

let tokenLector = null;

let ingresosRegistrados = 0;

let expiracionToken = null;
    // ==========================================
// AUTORIZAR LECTOR DESDE GITHUB
// ==========================================

function autorizarDesdeGitHub(){

    const input =
        document.getElementById(
            "codigoSecretaria"
        );


    const boton =
        document.getElementById(
            "btnAutorizar"
        );


    const estado =
        document.getElementById(
            "estadoAutorizacion"
        );


    const codigo =
        String(
            input.value || ""
        ).trim();


    if(!codigo){

        estado.innerHTML = `

            <div style="
                background:#FFF4E5;
                border:1px solid #F3D19C;
                border-radius:10px;
                padding:12px;
                color:#8A5A00;
            ">

                ⚠️ Ingresá el código de Secretaría.

            </div>

        `;

        input.focus();

        return;

    }


    boton.disabled = true;

    boton.innerHTML =
        "⏳ Verificando...";


    estado.innerHTML =
        "Conectando con Apps Script...";


    const callback =
        "respuestaAutorizacion_" +
        Date.now();


    window[callback] =
        function(respuesta){

            console.log(
                "Respuesta autorización:",
                respuesta
            );


            delete window[callback];


            script.remove();


            boton.disabled = false;

            boton.innerHTML =
                "🔐 Ingresar";


            /*
             * ==================================
             * AUTORIZACIÓN CORRECTA
             * ==================================
             */

            if(
                respuesta &&
                respuesta.ok === true
            ){

                tokenLector =
                    respuesta.token;
                
                expiracionToken =
    Date.now() +
    (30 * 60 * 1000);


                estado.innerHTML = `

                    <div style="
                        background:#EEF7EE;
                        border:1px solid #B7E4C7;
                        border-radius:10px;
                        padding:15px;
                        color:#2E7D32;
                    ">

                        <b>
                            ✅ Autorización correcta
                        </b>

                        <br><br>

                        Preparando lector...

                    </div>

                `;


                setTimeout(
                    function(){

                        mostrarLector();

                    },
                    700
                );


                return;

            }


            /*
             * ==================================
             * AUTORIZACIÓN RECHAZADA
             * ==================================
             */

            estado.innerHTML = `

                <div style="
                    background:#FDECEC;
                    border:1px solid #F5C2C2;
                    border-radius:10px;
                    padding:15px;
                    color:#B00020;
                ">

                    ❌

                    <b>
                        Código incorrecto
                    </b>

                    <br><br>

                    Verificá el código
                    de Secretaría.

                </div>

            `;


            input.value = "";

            input.focus();

        };


    const script =
        document.createElement(
            "script"
        );


    script.src =
        "https://script.google.com/macros/s/" +
        "AKfycbwyKsXfNxet9ScWu1sQ40eoy6Q2rYfMKsmd6Ic3Fy39AEmw8raRAH74chzsfq6qksouJQ" +
        "/exec" +
        "?accion=autorizarLector" +
        "&codigo=" +
        encodeURIComponent(codigo) +
        "&callback=" +
        encodeURIComponent(callback);


    script.onerror =
        function(){

            script.remove();


            boton.disabled = false;

            boton.innerHTML =
                "🔐 Ingresar";


            estado.innerHTML = `

                <div style="
                    background:#FDECEC;
                    border:1px solid #F5C2C2;
                    border-radius:10px;
                    padding:15px;
                    color:#B00020;
                ">

                    ❌ No se pudo conectar
                    con el servidor.

                </div>

            `;

        };


    document.body.appendChild(
        script
    );

}
    // ==========================================
// MOSTRAR LECTOR
// ==========================================

function mostrarLector(){

    const autorizacion =
        document.getElementById(
            "pantallaAutorizacion"
        );


    const lector =
        document.getElementById(
            "pantallaLector"
        );


    if(autorizacion){

        autorizacion.style.display =
            "none";

    }


    if(lector){

        lector.style.display =
            "block";

    }
    actualizarContadorIngresos();

actualizarExpiracionSesion();

}
    // ==========================================
// ACTUALIZAR CONTADOR DE INGRESOS
// ==========================================

function actualizarContadorIngresos(){

    const contador =
        document.getElementById(
            "contadorIngresos"
        );


    if(!contador){

        return;

    }


    contador.innerHTML = `

        🎟️ Ingresos registrados:

        <b>
            ${ingresosRegistrados}
        </b>

    `;

}
    // ==========================================
// MOSTRAR EXPIRACIÓN DE SESIÓN
// ==========================================

function actualizarExpiracionSesion(){

    const elemento =
        document.getElementById(
            "expiracionSesion"
        );


    if(!elemento){

        return;

    }


    if(!expiracionToken){

        elemento.innerHTML =
            "⏱️ Sesión activa";

        return;

    }


    const fecha =
        new Date(
            expiracionToken
        );


    const horas =
        String(
            fecha.getHours()
        ).padStart(
            2,
            "0"
        );


    const minutos =
        String(
            fecha.getMinutes()
        ).padStart(
            2,
            "0"
        );


    elemento.innerHTML = `

        ⏱️ Sesión válida hasta
        <b>
            ${horas}:${minutos}
        </b>

    `;

}
    


    function iniciarScanner(){

        const estado =
            document.getElementById(
                "estado"
            );

        const boton =
            document.getElementById(
                "btnIniciarScanner"
            );


        if(scannerActivo){

            return;

        }


        estado.innerHTML =
            "⏳ Iniciando cámara...";


        boton.disabled = true;


        scannerQR =
            new Html5Qrcode(
                "lectorQR"
            );


        const configuracion = {

            fps: 10,

            qrbox: {

                width: 250,

                height: 250

            }

        };


        scannerQR.start(

            {
                facingMode:
                    "environment"
            },

            configuracion,

            function(decodedText){

    console.log(
        "QR detectado:",
        decodedText
    );


    procesarQRDetectado(
        decodedText
    );

},

            function(errorMessage){

                /*
                 * No mostramos errores
                 * de búsqueda.
                 */

            }

        )

        .then(function(){

            scannerActivo = true;

            estado.innerHTML =
                "📷 Cámara activa.<br>" +
                "Apuntá al código QR.";

        })

        .catch(function(error){

            console.error(
                error
            );


            scannerActivo = false;
            
            boton.disabled = false;


            estado.innerHTML = `

                <div style="
                    background:#FDECEC;
                    border:1px solid #F5C2C2;
                    border-radius:10px;
                    padding:15px;
                    color:#B00020;
                ">

                    ❌ No se pudo activar
                    la cámara.

                    <br><br>

                    ${error}

                </div>

            `;

        });

    }
    // ==========================================
// PROCESAR QR DETECTADO
// ==========================================

let procesandoQR = false;


function procesarQRDetectado(decodedText){

    /*
     * Evita procesar el mismo QR
     * varias veces mientras la cámara
     * continúa detectándolo.
     */

    if(procesandoQR){

        return;

    }


    /*
     * Verificar que exista token.
     */

    if(!tokenLector){

        mostrarResultadoAcceso({

            ok: false,

            tipo:
                "lector_no_autorizado",

            mensaje:
                "La sesión del lector no está autorizada."

        });

        return;

    }


    /*
     * Limpiar el texto recibido.
     */

    const idEntrada =
        String(
            decodedText || ""
        ).trim();


    if(!idEntrada){

        return;

    }


    procesandoQR = true;


    const estado =
        document.getElementById(
            "estado"
        );


    if(estado){

        estado.innerHTML = `

            <div style="
                background:#FFF4E5;
                border:1px solid #F3D19C;
                border-radius:10px;
                padding:18px;
                color:#8A5A00;
                text-align:center;
            ">

                <div style="
                    font-size:38px;
                    margin-bottom:8px;
                ">
                    ⏳
                </div>

                <b>
                    Verificando entrada...
                </b>

                <br><br>

                ${idEntrada}

            </div>

        `;

    }


    /*
     * ==========================================
     * CALLBACK
     * ==========================================
     */

    const callback =
        "respuestaIngreso_" +
        Date.now();


    window[callback] =
        function(respuesta){

            console.log(
                "Respuesta ingreso:",
                respuesta
            );


            /*
             * Eliminar callback global.
             */

            delete window[callback];


            /*
             * Eliminar script temporal.
             */

            if(script){

                script.remove();

            }


            /*
             * Mostrar resultado.
             */

            mostrarResultadoAcceso(
                respuesta
            );


            /*
             * Después de unos segundos,
             * dejamos listo el lector
             * para la siguiente persona.
             */

            setTimeout(
                function(){

                    procesandoQR = false;

                    const estadoActual =
                        document.getElementById(
                            "estado"
                        );


                    if(estadoActual){

                        estadoActual.innerHTML = `

                            <div style="
                                background:#EEF3FA;
                                border:1px solid #C8D8EF;
                                border-radius:10px;
                                padding:15px;
                                color:#315A8A;
                                text-align:center;
                            ">

                                <div style="
                                    font-size:35px;
                                ">
                                    📷
                                </div>

                                <b>
                                    Listo para el siguiente ingreso
                                </b>

                                <br><br>

                                Apuntá al próximo código QR.

                            </div>

                        `;

                    }

                },
                2500
            );

        };


    /*
     * ==========================================
     * CREAR PETICIÓN
     * ==========================================
     */

    const script =
        document.createElement(
            "script"
        );


    script.src =
        "https://script.google.com/macros/s/" +
        "AKfycbwyKsXfNxet9ScWu1sQ40eoy6Q2rYfMKsmd6Ic3Fy39AEmw8raRAH74chzsfq6qksouJQ" +
        "/exec" +
        "?accion=registrarIngreso" +
        "&idEntrada=" +
        encodeURIComponent(
            idEntrada
        ) +
        "&token=" +
        encodeURIComponent(
            tokenLector
        ) +
        "&callback=" +
        encodeURIComponent(
            callback
        );


    /*
     * ==========================================
     * ERROR DE CONEXIÓN
     * ==========================================
     */

    script.onerror =
        function(){

            console.error(
                "No se pudo conectar con Apps Script."
            );


            if(script){

                script.remove();

            }


            mostrarResultadoAcceso({

                ok: false,

                tipo:
                    "error_conexion",

                mensaje:
                    "No se pudo conectar con el servidor."

            });


            setTimeout(
                function(){

                    procesandoQR = false;

                },
                2500
            );

        };


    document.body.appendChild(
        script
    );

}
    // ==========================================
// MOSTRAR RESULTADO DEL ACCESO
// ==========================================

function mostrarResultadoAcceso(respuesta){

    const estado =
        document.getElementById(
            "estado"
        );


    if(!estado){

        return;

    }


    /*
     * ==========================================
     * ACCESO AUTORIZADO
     * ==========================================
     */

    if(
        respuesta &&
        respuesta.ok === true &&
        respuesta.tipo ===
            "acceso_autorizado"
    ){
        ingresosRegistrados++;

actualizarContadorIngresos();

        estado.innerHTML = `

            <div style="
                background:#EEF7EE;
                border:1px solid #B7E4C7;
                border-radius:12px;
                padding:20px;
                color:#2E7D32;
                text-align:center;
            ">

                <div style="
                    font-size:55px;
                    margin-bottom:8px;
                ">
                    🟢
                </div>

                <div style="
                    font-size:22px;
                    font-weight:bold;
                ">
                    ACCESO AUTORIZADO
                </div>

                <br>

                <b>
                    ${respuesta.idEntrada || ""}
                </b>

                <br><br>

                ${
                    respuesta.nombre || ""
                }

                ${
                    respuesta.apellido || ""
                }

                <br>

                📍
                ${
                    respuesta.sede || ""
                }

                <br><br>

                <span style="
                    font-size:13px;
                    color:#555;
                ">

                    Ingreso registrado:
                    ${
                        respuesta.horaIngreso || ""
                    }

                </span>

            </div>

        `;

        return;

    }


    /*
     * ==========================================
     * ENTRADA YA UTILIZADA
     * ==========================================
     */

    if(
        respuesta &&
        (
            respuesta.tipo ===
                "ya_utilizada" ||

            respuesta.tipo ===
                "entrada_ya_utilizada"
        )
    ){

        estado.innerHTML = `

            <div style="
                background:#FDECEC;
                border:1px solid #F5C2C2;
                border-radius:12px;
                padding:20px;
                color:#B00020;
                text-align:center;
            ">

                <div style="
                    font-size:55px;
                    margin-bottom:8px;
                ">
                    🔴
                </div>

                <div style="
                    font-size:22px;
                    font-weight:bold;
                ">
                    ENTRADA YA UTILIZADA
                </div>

                <br>

                <b>
                    ${
                        respuesta.idEntrada || ""
                    }
                </b>

                <br><br>

                ${
                    respuesta.mensaje ||
                    "Esta entrada ya fue utilizada."
                }

            </div>

        `;

        return;

    }


    /*
     * ==========================================
     * ENTRADA NO VÁLIDA
     * ==========================================
     */

    if(
        respuesta &&
        (
            respuesta.tipo ===
                "entrada_no_valida" ||

            respuesta.tipo ===
                "no_encontrada"
        )
    ){

        estado.innerHTML = `

            <div style="
                background:#FFF4E5;
                border:1px solid #F3D19C;
                border-radius:12px;
                padding:20px;
                color:#8A5A00;
                text-align:center;
            ">

                <div style="
                    font-size:55px;
                    margin-bottom:8px;
                ">
                    ❌
                </div>

                <div style="
                    font-size:22px;
                    font-weight:bold;
                ">
                    ENTRADA NO VÁLIDA
                </div>

                <br>

                ${
                    respuesta.mensaje ||
                    "No se encontró una entrada válida."
                }

            </div>

        `;

        return;

    }


    /*
     * ==========================================
     * LECTOR NO AUTORIZADO
     * ==========================================
     */

    if(
        respuesta &&
        respuesta.tipo ===
            "lector_no_autorizado"
    ){

        estado.innerHTML = `

            <div style="
                background:#FDECEC;
                border:1px solid #F5C2C2;
                border-radius:12px;
                padding:20px;
                color:#B00020;
                text-align:center;
            ">

                <div style="
                    font-size:50px;
                ">
                    🔐
                </div>

                <b>
                    LECTOR NO AUTORIZADO
                </b>

                <br><br>

                ${
                    respuesta.mensaje ||
                    "La sesión no está autorizada."
                }

            </div>

        `;

        return;

    }


    /*
     * ==========================================
     * ERROR GENERAL
     * ==========================================
     */

    estado.innerHTML = `

        <div style="
            background:#FDECEC;
            border:1px solid #F5C2C2;
            border-radius:12px;
            padding:20px;
            color:#B00020;
            text-align:center;
        ">

            <div style="
                font-size:50px;
            ">
                ⚠️
            </div>

            <b>
                No se pudo procesar la entrada
            </b>

            <br><br>

            ${
                respuesta &&
                (
                    respuesta.mensaje ||
                    respuesta.error
                )
                ||
                "Ocurrió un error inesperado."
            }

        </div>

    `;

}
    
</script>


</body>

</html>
