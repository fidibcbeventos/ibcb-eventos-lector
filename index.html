<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>IBCB Eventos — Control de Acceso</title>

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            padding: 20px;

            background: #F5F7FA;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }

        .contenedor {

            width: 100%;
            max-width: 600px;

            margin: 0 auto;

            background: #FFFFFF;

            border-radius: 16px;

            padding: 25px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);

        }

        .encabezado {

            text-align: center;

            margin-bottom: 25px;

        }

        .icono {

            font-size: 55px;

            margin-bottom: 5px;

        }

        h1 {

            margin: 5px 0;

            font-size: 26px;

        }

        .subtitulo {

            color: #666666;

            font-size: 15px;

        }

        #lectorQR {

            width: 100%;

            max-width: 500px;

            margin: 20px auto;

        }

        button {

            width: 100%;

            border: 0;

            border-radius: 10px;

            padding: 15px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            background: #1677FF;

            color: #FFFFFF;

        }

        button:disabled {

            opacity: 0.6;

            cursor: default;

        }

        #estado {

            margin-top: 20px;

            text-align: center;

            font-size: 15px;

            line-height: 1.5;

        }

    </style>

</head>


<body>

    <div class="contenedor">


        <div class="encabezado">

            <div class="icono">
                📷
            </div>

            <h1>
                Control de Acceso
            </h1>

            <div class="subtitulo">

                IBCB Eventos

            </div>

        </div>


        <!-- LECTOR -->

        <div id="lectorQR"></div>


        <!-- ESTADO -->

        <div id="estado">

            Presioná el botón para activar
            la cámara.

        </div>


        <br>

<button
    onclick="probarConexionAppsScript()"
    style="margin-bottom:12px;">

    🔗 Probar conexión con Apps Script

</button>
        <button
            id="btnIniciarScanner"
            onclick="iniciarScanner()">

            📷 Activar cámara

        </button>


    </div>


<script>

    let scannerQR = null;

    let scannerActivo = false;


    function iniciarScanner(){

        const estado =
            document.getElementById(
                "estado"
            );

        const boton =
            document.getElementById(
                "btnIniciarScanner"
            );


        if(scannerActivo){

            return;

        }


        estado.innerHTML =
            "⏳ Iniciando cámara...";


        boton.disabled = true;


        scannerQR =
            new Html5Qrcode(
                "lectorQR"
            );


        const configuracion = {

            fps: 10,

            qrbox: {

                width: 250,

                height: 250

            }

        };


        scannerQR.start(

            {
                facingMode:
                    "environment"
            },

            configuracion,

            function(decodedText){

                console.log(
                    "QR detectado:",
                    decodedText
                );


                estado.innerHTML = `

                    <div style="
                        background:#EEF7EE;
                        padding:15px;
                        border-radius:10px;
                        color:#2E7D32;
                    ">

                        <b>
                            ✅ QR detectado
                        </b>

                        <br><br>

                        Código:

                        <b>
                            ${decodedText}
                        </b>

                    </div>

                `;


                /*
                 * Por ahora NO enviamos
                 * nada a Apps Script.
                 *
                 * Primero comprobamos
                 * que el lector funcione.
                 */

            },

            function(errorMessage){

                /*
                 * No mostramos errores
                 * de búsqueda.
                 */

            }

        )

        .then(function(){

            scannerActivo = true;

            estado.innerHTML =
                "📷 Cámara activa.<br>" +
                "Apuntá al código QR.";

        })

        .catch(function(error){

            console.error(
                error
            );


            scannerActivo = false;
            
            boton.disabled = false;


            estado.innerHTML = `

                <div style="
                    background:#FDECEC;
                    border:1px solid #F5C2C2;
                    border-radius:10px;
                    padding:15px;
                    color:#B00020;
                ">

                    ❌ No se pudo activar
                    la cámara.

                    <br><br>

                    ${error}

                </div>

            `;

        });

    }
    function respuestaConexion(respuesta){

    console.log(
        "Respuesta Apps Script:",
        respuesta
    );

    const estado =
        document.getElementById("estado");

    if(!estado){

        return;

    }

    estado.innerHTML = `

        <div style="
            background:#EEF7EE;
            border:1px solid #B7E4C7;
            border-radius:10px;
            padding:18px;
            color:#2E7D32;
            text-align:center;
        ">

            <div style="
                font-size:35px;
                margin-bottom:8px;
            ">
                ✅
            </div>

            <b>
                CONEXIÓN CORRECTA
            </b>

            <br><br>

            ${respuesta.mensaje}

        </div>

    `;

}
function probarConexionAppsScript(){

    const estado =
        document.getElementById("estado");


    if(estado){

        estado.innerHTML =
            "⏳ Conectando con Apps Script...";

    }


    const script =
        document.createElement("script");


    script.src =
        "https://script.google.com/macros/s/" +
        "AKfycbwyKsXfNxet9ScWu1sQ40eoy6Q2rYfMKsmd6Ic3Fy39AEmw8raRAH74chzsfq6qksouJQ" +
        "/exec" +
        "?accion=pingLector" +
        "&callback=respuestaConexion";


    script.onerror = function(){

        if(estado){

            estado.innerHTML = `

                <div style="
                    background:#FDECEC;
                    border:1px solid #F5C2C2;
                    border-radius:10px;
                    padding:15px;
                    color:#B00020;
                    text-align:center;
                ">

                    ❌ No se pudo cargar
                    la respuesta de Apps Script.

                </div>

            `;

        }

    };


    document.body.appendChild(
        script
    );

}
</script>


</body>

</html>
